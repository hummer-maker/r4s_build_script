name: Build R76S Clean RSS Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            libelf-dev \
            liblzma-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            zstd \
            xxd \
            u-boot-tools \
            ccache

      - name: Clone pinned OpenWrt
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

          git checkout 0c0d6dd7d12ff707813f99a03fa4d1c521c7b70c

          echo "===== OPENWRT COMMIT ====="
          git rev-parse HEAD

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Replace r8169 with r8125 RSS on R76S
        working-directory: openwrt
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("target/linux/rockchip/image/armv8.mk")
          text = path.read_text()

          start = text.index("define Device/friendlyarm_nanopi-r76s")
          end = text.index("endef", start)

          block = text[start:end]

          if "kmod-r8169" not in block:
              raise SystemExit("ERROR: kmod-r8169 was not found in R76S device block")

          block = block.replace("kmod-r8169", "kmod-r8125-rss")

          text = text[:start] + block + text[end:]
          path.write_text(text)

          print("===== MODIFIED R76S DEVICE BLOCK =====")
          start = text.index("define Device/friendlyarm_nanopi-r76s")
          end = text.index("endef", start) + len("endef")
          print(text[start:end])
          PY

      - name: Add RTL8125B MSI-X RSS patch
        working-directory: openwrt
        run: |
          mkdir -p package/kernel/r8125/patches

          cat > package/kernel/r8125/patches/999-r8125b-min-msix-4.patch <<'PATCH'
          --- a/src/r8125.h
          +++ b/src/r8125.h
          @@ -687,7 +687,7 @@
           #define R8125_MAX_MSIX_VEC_8125A   4
           #define R8125_MAX_MSIX_VEC_8125B   32
           #define R8125_MAX_MSIX_VEC_8125D   32
          -#define R8125_MIN_MSIX_VEC_8125B   22
          +#define R8125_MIN_MSIX_VEC_8125B   4
           #define R8125_MIN_MSIX_VEC_8125BP  32
           #define R8125_MIN_MSIX_VEC_8125CP  31
           #define R8125_MIN_MSIX_VEC_8125D   20
          PATCH

          echo "===== RSS PATCH ====="
          cat package/kernel/r8125/patches/999-r8125b-min-msix-4.patch

      - name: Configure NanoPi R76S
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y

          CONFIG_PACKAGE_kmod-r8125-rss=y
          # CONFIG_PACKAGE_kmod-r8169 is not set

          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_pciutils=y
          EOF

          make defconfig

      - name: Pre-flight target check
        working-directory: openwrt
        run: |
          echo "===== TARGET ====="
          grep -E '^CONFIG_TARGET_' .config | head -40

          grep -qx 'CONFIG_TARGET_rockchip=y' .config
          grep -qx 'CONFIG_TARGET_rockchip_armv8=y' .config
          grep -qx 'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y' .config

          echo "===== KERNEL ====="
          grep 'KERNEL_PATCHVER' target/linux/rockchip/Makefile
          cat target/linux/generic/kernel-6.18

          echo "===== ETHERNET DRIVER ====="
          grep -E 'CONFIG_PACKAGE_kmod-(r8125-rss|r8169)' .config || true

          grep -qx 'CONFIG_PACKAGE_kmod-r8125-rss=y' .config

          if grep -Eq '^CONFIG_PACKAGE_kmod-r8169=[ym]$' .config; then
            echo "ERROR: kmod-r8169 is still enabled"
            exit 1
          fi

          echo "Pre-flight target check PASSED"

      - name: Prepare and verify patched r8125
        working-directory: openwrt
        run: |
          make package/kernel/r8125/prepare V=s

          HEADER="$(find build_dir -type f -path '*/r8125-*/src/r8125.h' | head -n 1)"

          if [ -z "$HEADER" ]; then
            echo "ERROR: prepared r8125.h was not found"
            exit 1
          fi

          echo "===== PREPARED R8125 HEADER ====="
          echo "$HEADER"

          grep 'R8125_MIN_MSIX_VEC_8125B' "$HEADER"

          grep -q '#define R8125_MIN_MSIX_VEC_8125B   4' "$HEADER"

          echo "RSS MSI-X patch PASSED"

      - name: Build OpenWrt
        id: build
        continue-on-error: true
        working-directory: openwrt
        run: |
          make -j"$(nproc)"

      - name: Debug build failure
        if: steps.build.outcome == 'failure'
        working-directory: openwrt
        run: |
          make -j1 V=s

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        run: |
          echo "OpenWrt build failed"
          exit 1

      - name: Show generated R76S images
        working-directory: openwrt
        run: |
          echo "===== R76S IMAGES ====="
          find bin/targets/rockchip/armv8 -maxdepth 1 -type f \
            -iname '*r76s*' -print

      - name: Upload R76S RSS firmware
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r76s-clean-rss-test
          path: |
            openwrt/bin/targets/rockchip/armv8/*r76s*
            openwrt/bin/targets/rockchip/armv8/*.manifest
            openwrt/bin/targets/rockchip/armv8/config.buildinfo
            openwrt/bin/targets/rockchip/armv8/profiles.json
